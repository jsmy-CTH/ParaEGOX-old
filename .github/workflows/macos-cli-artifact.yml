name: macos-cli-artifact

on:
  workflow_dispatch:
  push:
    branches:
      - "build/macos-artifact-*"

permissions:
  contents: read

jobs:
  build-paraegox-cli:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install repository-pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Report active Rust toolchain
        run: rustup show active-toolchain

      - name: Install repository-pinned uv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/paraegox-uv-bootstrap"
          "$RUNNER_TEMP/paraegox-uv-bootstrap/bin/python" -m pip install \
            --disable-pip-version-check \
            'uv==0.11.32'
          printf '%s\n' "$RUNNER_TEMP/paraegox-uv-bootstrap/bin" >> "$GITHUB_PATH"

      - name: Prepare locked Python environment
        run: uv sync --locked

      - name: Verify Textual client and internal entrypoint
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen ruff check \
            src/paraegox_sdk/console_client.py \
            src/paraegox_sdk/console_tui.py \
            tests/console \
            scripts/smoke_macos_textual_chat.py
          uv run --frozen python scripts/check_governance.py
          uv run --frozen pytest tests/console -q
          uv run --frozen paraegox-console --help

      - name: Build the ParaEGOX CLI
        run: cargo build --locked -p paraegox-local --bin paraegox

      - name: Verify native binary and public CLI
        shell: bash
        run: |
          set -euo pipefail

          binary="target/debug/paraegox"
          test -x "$binary"

          binary_description="$(file -b "$binary")"
          printf '%s\n' "$binary_description"
          case "$binary_description" in
            "Mach-O 64-bit executable x86_64"*) ;;
            *)
              printf 'unexpected ParaEGOX artifact: %s\n' "$binary_description" >&2
              exit 1
              ;;
          esac

          help_output="$RUNNER_TEMP/paraegox-help.txt"
          "$binary" --help | tee "$help_output"

          grep -Fqx 'Usage: paraegox chat --config <absolute-paraegox.toml>' "$help_output"
          grep -Fqx '       paraegox init --directory <absolute-directory> --json' "$help_output"
          grep -Fqx '       paraegox up --config <absolute-paraegox.toml> --json' "$help_output"
          grep -Fqx '       paraegox status --config <absolute-paraegox.toml> --json' "$help_output"
          grep -Fqx '       paraegox down --config <absolute-paraegox.toml> --json' "$help_output"
          grep -Fqx '       paraegox deploy --local --config <absolute-paraegox.toml> --json' "$help_output"
          grep -Fqx '       paraegox node --config <absolute-paraegox-node.toml>' "$help_output"
          grep -Fqx '       paraegox deployment --config <absolute-paraegox-deployment.toml>' "$help_output"
          grep -Fqx '       paraegox version --json' "$help_output"
          grep -Fqx '       paraegox config check <chat|node|deployment> --config <absolute-config.toml> --json' "$help_output"
          grep -Fqx '       paraegox doctor <chat|node|deployment> --config <absolute-config.toml> --offline --json' "$help_output"
          grep -Fqx '       paraegox --help' "$help_output"
          test "$(grep -Ec '^(Usage: paraegox|       paraegox)' "$help_output")" -eq 12

          version_json="$RUNNER_TEMP/paraegox-version.json"
          init_first_json="$RUNNER_TEMP/paraegox-init-first.json"
          init_repeat_json="$RUNNER_TEMP/paraegox-init-repeat.json"
          init_config_json="$RUNNER_TEMP/paraegox-init-config-check.json"
          deploy_rejected_json="$RUNNER_TEMP/paraegox-deploy-rejected.json"
          deploy_grammar_json="$RUNNER_TEMP/paraegox-deploy-grammar.json"
          config_json="$RUNNER_TEMP/paraegox-config-check.json"
          doctor_json="$RUNNER_TEMP/paraegox-doctor.json"
          invalid_json="$RUNNER_TEMP/paraegox-invalid-config.json"
          version_stderr="$RUNNER_TEMP/paraegox-version.stderr"
          init_stderr="$RUNNER_TEMP/paraegox-init.stderr"
          deploy_stderr="$RUNNER_TEMP/paraegox-deploy.stderr"
          deploy_grammar_stderr="$RUNNER_TEMP/paraegox-deploy-grammar.stderr"
          config_stderr="$RUNNER_TEMP/paraegox-config-check.stderr"
          doctor_stderr="$RUNNER_TEMP/paraegox-doctor.stderr"
          invalid_stderr="$RUNNER_TEMP/paraegox-invalid-config.stderr"
          offline_config="$RUNNER_TEMP/paraegox-offline-check.toml"
          offline_state_root="$RUNNER_TEMP/paraegox-offline-state"
          physical_runner_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          init_directory="$physical_runner_temp/paraegox-init-smoke"
          OFFLINE_CONFIG="$offline_config" \
            OFFLINE_STATE_ROOT="$offline_state_root" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path


          Path(os.environ["OFFLINE_CONFIG"]).write_text(
              "schema_version = 1\n"
              f"state_root = {json.dumps(os.environ['OFFLINE_STATE_ROOT'])}\n"
              'fabric_listen = "tcp/127.0.0.1:7447"\n\n'
              "[model]\n"
              'provider = "deepseek-chat-completions-v1"\n'
              'model = "deepseek-v4-flash"\n'
              'secret_ref = "env:DEEPSEEK_API_KEY"\n',
              encoding="utf-8",
          )
          PY
          test ! -e "$offline_state_root"
          test ! -e "$init_directory"
          "$binary" version --json > "$version_json" 2> "$version_stderr"
          OPENAI_API_KEY='init poison Secret value' \
            DEEPSEEK_API_KEY='init poison Secret value' \
            "$binary" init \
              --directory "$init_directory" \
              --json > "$init_first_json" 2> "$init_stderr"
          test ! -s "$init_stderr"
          test "$(stat -f '%Lp' "$init_directory")" = '700'
          test "$(stat -f '%Lp' "$init_directory/paraegox.toml")" = '600'
          test "$(stat -f '%u:%g' "$init_directory")" = "$(id -u):$(id -g)"
          test "$(stat -f '%u:%g' "$init_directory/paraegox.toml")" = "$(id -u):$(id -g)"
          test "$(stat -f '%l' "$init_directory/paraegox.toml")" = '1'
          test ! -L "$init_directory"
          test ! -L "$init_directory/paraegox.toml"
          test ! -e "$init_directory/state"
          test "$(find "$init_directory" -print | wc -l | tr -d ' ')" -eq 2
          init_config_identity="$(stat -f '%d:%i:%m:%c' "$init_directory/paraegox.toml")"
          init_config_sha256="$(shasum -a 256 "$init_directory/paraegox.toml" | cut -d ' ' -f 1)"
          OPENAI_API_KEY='init poison Secret value' \
            DEEPSEEK_API_KEY='init poison Secret value' \
            "$binary" init \
              --directory "$init_directory" \
              --json > "$init_repeat_json" 2> "$init_stderr"
          test ! -s "$init_stderr"
          test "$(stat -f '%d:%i:%m:%c' "$init_directory/paraegox.toml")" = \
            "$init_config_identity"
          test "$(shasum -a 256 "$init_directory/paraegox.toml" | cut -d ' ' -f 1)" = \
            "$init_config_sha256"
          "$binary" config check chat \
            --config "$init_directory/paraegox.toml" \
            --json > "$init_config_json" 2> "$init_stderr"
          test ! -e "$init_directory/state"
          set +e
          OPENAI_API_KEY='deploy poison Secret value' \
            DEEPSEEK_API_KEY='deploy poison Secret value' \
            "$binary" deploy --local \
              --config "$offline_config" \
              --json > "$deploy_rejected_json" 2> "$deploy_stderr"
          deploy_status=$?
          set -e
          test "$deploy_status" -eq 2
          test ! -s "$deploy_stderr"
          test ! -e "$offline_state_root"
          set +e
          "$binary" deploy --local \
            --config "$offline_config" \
            --json --retry > "$deploy_grammar_json" 2> "$deploy_grammar_stderr"
          deploy_grammar_status=$?
          set -e
          test "$deploy_grammar_status" -eq 2
          test ! -s "$deploy_grammar_stderr"
          test ! -e "$offline_state_root"
          OPENAI_API_KEY='offline poison Secret value' \
            DEEPSEEK_API_KEY='offline poison Secret value' \
            "$binary" config check chat \
            --config "$offline_config" \
            --json > "$config_json" 2> "$config_stderr"
          OPENAI_API_KEY='offline poison Secret value' \
            DEEPSEEK_API_KEY='offline poison Secret value' \
            "$binary" doctor chat \
            --config "$offline_config" \
            --offline --json > "$doctor_json" 2> "$doctor_stderr"
          set +e
          "$binary" config check chat \
            --config "$RUNNER_TEMP/does-not-exist.toml" \
            --json > "$invalid_json" 2> "$invalid_stderr"
          invalid_status=$?
          set -e
          test "$invalid_status" -eq 2
          test ! -s "$version_stderr"
          test ! -s "$init_stderr"
          test ! -s "$deploy_stderr"
          test ! -s "$deploy_grammar_stderr"
          test ! -s "$config_stderr"
          test ! -s "$doctor_stderr"
          test ! -s "$invalid_stderr"
          test ! -e "$offline_state_root"
          VERSION_JSON="$version_json" \
            INIT_FIRST_JSON="$init_first_json" \
            INIT_REPEAT_JSON="$init_repeat_json" \
            INIT_CONFIG_JSON="$init_config_json" \
            INIT_DIRECTORY="$init_directory" \
            DEPLOY_REJECTED_JSON="$deploy_rejected_json" \
            DEPLOY_GRAMMAR_JSON="$deploy_grammar_json" \
            CONFIG_JSON="$config_json" \
            DOCTOR_JSON="$doctor_json" \
            INVALID_JSON="$invalid_json" \
            OFFLINE_CONFIG="$offline_config" \
            OFFLINE_STATE_ROOT="$offline_state_root" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path


          def load_one(name: str) -> dict:
              raw = Path(os.environ[name]).read_bytes()
              if not raw.endswith(b"\n") or raw.count(b"\n") != 1:
                  raise SystemExit(f"{name} is not one newline-terminated JSON object")
              value = json.loads(raw)
              if not isinstance(value, dict):
                  raise SystemExit(f"{name} is not a JSON object")
              return value


          version = load_one("VERSION_JSON")
          init_first = load_one("INIT_FIRST_JSON")
          init_repeat = load_one("INIT_REPEAT_JSON")
          init_config = load_one("INIT_CONFIG_JSON")
          deploy_rejected = load_one("DEPLOY_REJECTED_JSON")
          deploy_grammar = load_one("DEPLOY_GRAMMAR_JSON")
          config = load_one("CONFIG_JSON")
          doctor = load_one("DOCTOR_JSON")
          invalid = load_one("INVALID_JSON")
          if (version["schema_version"], version["command"], version["ok"]) != (
              1,
              "version",
              True,
          ):
              raise SystemExit(f"unexpected version envelope: {version!r}")
          expected_init_fields = {
              "schema_version",
              "command",
              "ok",
              "changed",
              "profile",
              "config_relative_path",
              "state_relative_path",
              "diagnostics",
          }
          for result, changed in ((init_first, True), (init_repeat, False)):
              if set(result) != expected_init_fields:
                  raise SystemExit(f"unexpected init fields: {result!r}")
              if (
                  result["schema_version"],
                  result["command"],
                  result["ok"],
                  result["changed"],
                  result["profile"],
                  result["config_relative_path"],
                  result["state_relative_path"],
                  result["diagnostics"],
              ) != (
                  1,
                  "init",
                  True,
                  changed,
                  "deterministic-echo-v1",
                  "paraegox.toml",
                  "state",
                  [],
              ):
                  raise SystemExit(f"unexpected init envelope: {result!r}")
              serialized = str(result)
              if os.environ["INIT_DIRECTORY"] in serialized:
                  raise SystemExit("init output leaked its absolute directory")
              if "init poison Secret value" in serialized:
                  raise SystemExit("init output leaked a Secret canary")
          if (
              init_config["command"],
              init_config["kind"],
              init_config["ok"],
              init_config["profile"],
          ) != ("config.check", "chat", True, "deterministic-echo-v1"):
              raise SystemExit(f"generated config failed strict check: {init_config!r}")
          if os.environ["INIT_DIRECTORY"] in str(init_config):
              raise SystemExit("generated config check leaked the init directory")
          expected_deploy_fields = {
              "schema_version",
              "command",
              "mode",
              "ok",
              "profile",
              "changed",
              "generation",
              "deployment_revision",
              "controller_snapshot_sequence",
              "runtime_apply_request_digest",
              "runtime_terminal_receipt_digest",
              "terminal_outcome",
              "current_health_checked",
              "diagnostics",
          }
          expected_deploy_diagnostics = (
              (
                  deploy_rejected,
                  "PXLC-DEPLOY-PROFILE-UNSUPPORTED",
                  "local deploy supports only the deterministic-echo-v1 profile",
              ),
              (
                  deploy_grammar,
                  "PXLC-DEPLOY-GRAMMAR",
                  "deploy requires exactly --local --config "
                  "<absolute-paraegox.toml> --json",
              ),
          )
          for result, code, message in expected_deploy_diagnostics:
              if set(result) != expected_deploy_fields:
                  raise SystemExit(f"unexpected deploy fields: {result!r}")
              if (
                  result["schema_version"],
                  result["command"],
                  result["mode"],
                  result["ok"],
                  result["changed"],
                  result["current_health_checked"],
              ) != (1, "deploy", "local", False, False, False):
                  raise SystemExit(f"unexpected rejected deploy envelope: {result!r}")
              for field in (
                  "profile",
                  "generation",
                  "deployment_revision",
                  "controller_snapshot_sequence",
                  "runtime_apply_request_digest",
                  "runtime_terminal_receipt_digest",
                  "terminal_outcome",
              ):
                  if result[field] is not None:
                      raise SystemExit(f"rejected deploy exposed {field}: {result!r}")
              if result["diagnostics"] != [{"code": code, "message": message}]:
                  raise SystemExit(f"unexpected deploy diagnostic: {result!r}")
              rejected_text = str(result)
              if any(
                  forbidden in rejected_text
                  for forbidden in (
                      os.environ["OFFLINE_CONFIG"],
                      os.environ["OFFLINE_STATE_ROOT"],
                      "DEEPSEEK_API_KEY",
                      "deploy poison Secret value",
                  )
              ):
                  raise SystemExit("rejected deploy leaked config, state, or Secret material")
          if (config["command"], config["kind"], config["ok"]) != (
              "config.check",
              "chat",
              True,
          ):
              raise SystemExit(f"unexpected config-check envelope: {config!r}")
          if (doctor["command"], doctor["kind"], doctor["ok"]) != (
              "doctor.offline",
              "chat",
              True,
          ):
              raise SystemExit(f"unexpected doctor envelope: {doctor!r}")
          if config["secret_input_reference_present"] is not True:
              raise SystemExit("config check did not report the configured SecretRef")
          if doctor["secret_input_reference_present"] is not True:
              raise SystemExit("doctor did not report the configured SecretRef")
          if (invalid["command"], invalid["kind"], invalid["ok"]) != (
              "config.check",
              "chat",
              False,
          ):
              raise SystemExit(f"unexpected invalid-config envelope: {invalid!r}")
          if invalid["diagnostics"][0]["code"] != "PXLC-CONFIG-FILE-READ":
              raise SystemExit(f"unexpected invalid-config diagnostic: {invalid!r}")
          if "does-not-exist" in str(invalid):
              raise SystemExit("invalid-config output leaked the config path")
          for result in (config, doctor):
              if result["schema_version"] != 1:
                  raise SystemExit(f"unexpected offline schema version: {result!r}")
              serialized = str(result)
              if any(
                  path in serialized
                  for path in (
                      os.environ["OFFLINE_CONFIG"],
                      os.environ["OFFLINE_STATE_ROOT"],
                  )
              ):
                  raise SystemExit("offline output leaked an absolute config or state path")
              if "DEEPSEEK_API_KEY" in serialized or "offline poison Secret value" in serialized:
                  raise SystemExit("offline output leaked the SecretRef value")
              skipped = {item["id"] for item in result["checks_skipped"]}
              if not {"owner_startup", "network_connectivity", "runtime_readiness"} <= skipped:
                  raise SystemExit(f"offline boundary is incomplete: {result!r}")
          PY

          if "$binary" controller >/dev/null 2>&1; then
            printf 'bare controller unexpectedly selected a public command\n' >&2
            exit 1
          fi
          if "$binary" deployment controller >/dev/null 2>&1; then
            printf 'deployment unexpectedly accepted a bare controller submode\n' >&2
            exit 1
          fi

          if grep -Eq 'paraegox-local|developer-|fixture-v1|openai-v1|deepseek-v1|__node-daemon-child-v1|--node-bootstrap-file|--node-observation-bootstrap-file' "$help_output"; then
            printf 'hidden or legacy CLI surface is still exposed\n' >&2
            exit 1
          fi

      - name: Stage relocatable CLI and Textual bundle
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact
          install -m 0755 target/debug/paraegox artifact/paraegox
          runtime_requirements="$RUNNER_TEMP/paraegox-runtime-requirements.txt"
          uv export \
            --frozen \
            --no-dev \
            --no-emit-project \
            --format requirements.txt \
            --output-file "$runtime_requirements"
          uv pip install \
            --target artifact/python \
            --no-compile \
            --no-deps \
            --require-hashes \
            --requirements "$runtime_requirements"
          uv pip install \
            --target artifact/python \
            --no-compile \
            --no-deps \
            .
          RUNTIME_REQUIREMENTS="$runtime_requirements" \
            ARTIFACT_PYTHON="$PWD/artifact/python" \
            uv run --frozen python - <<'PY'
          import os
          import re
          from importlib.metadata import distributions
          from pathlib import Path

          from packaging.requirements import Requirement


          def canonical_name(value: str) -> str:
              return re.sub(r"[-_.]+", "-", value).lower()


          expected: dict[str, str] = {}
          requirements = Path(os.environ["RUNTIME_REQUIREMENTS"])
          for raw_line in requirements.read_text(encoding="utf-8").splitlines():
              if not raw_line or raw_line[0].isspace() or raw_line.startswith("#"):
                  continue
              requirement = Requirement(raw_line.removesuffix("\\").rstrip())
              if requirement.marker is not None and not requirement.marker.evaluate():
                  continue
              pins = [item.version for item in requirement.specifier if item.operator == "=="]
              if len(pins) != 1:
                  raise SystemExit(f"runtime dependency is not exactly pinned: {requirement}")
              expected[canonical_name(requirement.name)] = pins[0]

          actual = {
              canonical_name(distribution.metadata["Name"]): distribution.version
              for distribution in distributions(path=[os.environ["ARTIFACT_PYTHON"]])
              if canonical_name(distribution.metadata["Name"]) != "paraegox-sdk"
          }
          if actual != expected:
              raise SystemExit(
                  f"bundled runtime dependencies differ from uv.lock: "
                  f"expected={expected!r} actual={actual!r}"
              )
          PY
          if [ -d artifact/python/bin ]; then
            for generated_script in artifact/python/bin/*; do
              [ -e "$generated_script" ] || continue
              test -f "$generated_script"
              test ! -L "$generated_script"
              rm -- "$generated_script"
            done
            rmdir artifact/python/bin
          fi
          if [ -e artifact/python/.lock ]; then
            test -f artifact/python/.lock
            test ! -L artifact/python/.lock
            rm artifact/python/.lock
          fi
          install -m 0755 scripts/paraegox-console artifact/paraegox-console

          test "$(head -n 1 artifact/paraegox-console)" = '#!/usr/bin/env sh'
          test -f artifact/python/paraegox_sdk/console_tui.py
          test -f artifact/python/paraegox_sdk/console_client.py
          if grep -RIlE '^#!.*(/Users/runner|/_temp/|/home/runner)' artifact; then
            printf 'bundle contains a CI-absolute shebang\n' >&2
            exit 1
          fi

      - name: Smoke relocated parent, Textual child, and Rust Agent IPC
        shell: bash
        run: |
          set -euo pipefail

          relocated_bundle="$RUNNER_TEMP/ParaEGOX bundle"
          cp -R artifact "$relocated_bundle"
          relocated_stderr="$RUNNER_TEMP/paraegox-relocated-offline.stderr"
          test ! -e "$RUNNER_TEMP/paraegox-offline-state"
          "$relocated_bundle/paraegox" version --json \
            2> "$relocated_stderr" \
            | cmp - "$RUNNER_TEMP/paraegox-version.json"
          test ! -s "$relocated_stderr"
          OPENAI_API_KEY='offline poison Secret value' \
            DEEPSEEK_API_KEY='offline poison Secret value' \
            "$relocated_bundle/paraegox" config check chat \
              --config "$RUNNER_TEMP/paraegox-offline-check.toml" \
              --json 2> "$relocated_stderr" \
            | cmp - "$RUNNER_TEMP/paraegox-config-check.json"
          test ! -s "$relocated_stderr"
          OPENAI_API_KEY='offline poison Secret value' \
            DEEPSEEK_API_KEY='offline poison Secret value' \
            "$relocated_bundle/paraegox" doctor chat \
              --config "$RUNNER_TEMP/paraegox-offline-check.toml" \
              --offline --json 2> "$relocated_stderr" \
            | cmp - "$RUNNER_TEMP/paraegox-doctor.json"
          test ! -s "$relocated_stderr"
          set +e
          OPENAI_API_KEY='deploy poison Secret value' \
            DEEPSEEK_API_KEY='deploy poison Secret value' \
            "$relocated_bundle/paraegox" deploy --local \
              --config "$RUNNER_TEMP/paraegox-offline-check.toml" \
              --json 2> "$relocated_stderr" \
            | cmp - "$RUNNER_TEMP/paraegox-deploy-rejected.json"
          relocated_statuses=("${PIPESTATUS[@]}")
          set -e
          test "${relocated_statuses[0]}" -eq 2
          test "${relocated_statuses[1]}" -eq 0
          test ! -s "$relocated_stderr"
          test ! -e "$RUNNER_TEMP/paraegox-offline-state"
          smoke_python_prefix="$(.venv/bin/python3 -c 'import sys; print(sys.base_prefix)')"
          smoke_python="$smoke_python_prefix/bin/python3"
          test -x "$smoke_python"
          if "$smoke_python" -I -c 'import textual' >/dev/null 2>&1; then
            printf 'smoke interpreter unexpectedly contains Textual outside the bundle\n' >&2
            exit 1
          fi
          PATH="$smoke_python_prefix/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            "$smoke_python" scripts/smoke_macos_textual_chat.py \
              --bundle-dir "$relocated_bundle"

      - name: Checksum the complete bundle
        shell: bash
        run: |
          set -euo pipefail

          (
            cd artifact
            find . -type f ! -name SHA256SUMS -print \
              | LC_ALL=C sort \
              | while IFS= read -r path; do shasum -a 256 "$path"; done \
              > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )

      - name: Archive bundle with executable modes
        shell: bash
        run: |
          set -euo pipefail

          archive_name="paraegox-macos-x86_64-${GITHUB_SHA}.tar.gz"
          mkdir -p release
          tar -czf "release/$archive_name" -C artifact .
          (
            cd release
            shasum -a 256 "$archive_name" > "$archive_name.sha256"
            shasum -a 256 -c "$archive_name.sha256"
          )

          mode_check="$RUNNER_TEMP/paraegox-archive-mode-check"
          mkdir -p "$mode_check"
          tar -xzf "release/$archive_name" -C "$mode_check"
          test -x "$mode_check/paraegox"
          test -x "$mode_check/paraegox-console"

      - name: Upload commit-addressed macOS chat bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: paraegox-macos-x86_64-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7
