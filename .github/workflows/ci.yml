name: ci

on:
  pull_request:
  push:
    branches: [main, "build/ubuntu-validation-*"]

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install repository-pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Report active Rust toolchain
        run: rustup show active-toolchain
      - name: Formatting
        run: cargo fmt --all --check
      - name: Resolve locked workspace metadata
        run: cargo metadata --format-version 1 --locked > /dev/null
      - name: Check all targets
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked
      - name: Rust worker through ProcessDomain system test
        run: |
          cargo build -p paraegox-runtime --bin paraegox-rust-reference-worker --locked
          PARAEGOX_RUST_REFERENCE_WORKER="$PWD/target/debug/paraegox-rust-reference-worker" cargo test -p paraegox-runtime --locked process_domain::tests::rust_reference_worker_faults_preserve_uncertain_ownership_and_cleanup -- --ignored --exact
      - name: Documentation tests
        run: cargo test --workspace --doc --locked

  governance-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      PARAEGOX_M0_INIT_CLI_BINARY: ${{ github.workspace }}/target/debug/paraegox
      PARAEGOX_A1_ARTIFACT_CLI_BINARY: ${{ github.workspace }}/target/debug/paraegox
      PARAEGOX_D0B_EXTERNAL_ARTIFACT_CLI_BINARY: ${{ github.workspace }}/target/debug/paraegox
      PARAEGOX_M2_CLI_BINARY: ${{ github.workspace }}/target/debug/paraegox
      PARAEGOX_D0A_CLI_BINARY: ${{ github.workspace }}/target/debug/paraegox
      PARAEGOX_M3_INSPECTION_CLI_BINARY: ${{ github.workspace }}/target/debug/paraegox
      PARAEGOX_M4A_RECEIPT_CLI_BINARY: ${{ github.workspace }}/target/debug/paraegox
      PARAEGOX_M5A_TUI_CLI_BINARY: ${{ github.workspace }}/target/debug/paraegox
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install repository-pinned Rust toolchain for governance
        run: rustup toolchain install --no-self-update
      - name: Build exact-revision init, Artifact, lifecycle, deploy, Inspection, Receipt, and TUI CLI
        run: cargo build --locked -p paraegox-local --bin paraegox
      - name: Rebuild locked development environment
        run: uv sync --locked
      - name: Joint Artifact F0/A1 and D0b candidate evidence (non-admission)
        run: |
          uv run --frozen pytest tests/system/test_a1_local_artifact_cli.py
          uv run --frozen pytest tests/system/test_d0b_external_artifact_deploy_cli.py
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Governance fitness checks
        run: uv run --frozen python scripts/check_governance.py
      - name: Tests, including exact-binary init, Artifact, lifecycle, deploy, Inspection, Receipt, and TUI
        run: uv run --frozen pytest
      - name: Rust to Python ProcessDomain system test
        run: PARAEGOX_PYTHON="$PWD/.venv/bin/python" cargo test -p paraegox-runtime --locked process_domain::tests::python_reference_worker_round_trips_through_rust_process_domain -- --ignored --exact
